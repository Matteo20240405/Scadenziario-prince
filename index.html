<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scadenziario PRINCE Fire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200 gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 text-white p-3 rounded-2xl shadow-md shadow-blue-200">
                    <i class="fa-solid fa-shield-halved text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                        Scadenziario PRINCE <span class="text-blue-600 italic font-bold">Fire</span>
                    </h1>
                    <p class="text-xs font-semibold text-slate-400">Gestione Integrata Sheet & Cloud</p>
                </div>
            </div>

            <!-- Pulsanti di azione -->
            <div class="flex flex-wrap items-center gap-2">
                <button id="btn-sync" onclick="syncToGoogleSheets()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 px-4 rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span>Sincronizza Google Sheets</span>
                </button>
                <button onclick="exportExcel()" class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-700 border border-emerald-300/50 text-xs font-bold py-2.5 px-4 rounded-xl transition-all">
                    <i class="fa-solid fa-file-excel mr-1"></i> Esporta Excel
                </button>
                <button onclick="document.getElementById('modal-pratica').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-5 rounded-xl shadow-md shadow-blue-200 transition-all active:scale-95">
                    + Nuova Pratica
                </button>
            </div>
        </header>

        <div id="sync-banner" class="hidden bg-slate-900 text-white p-4 rounded-2xl shadow-lg border border-slate-800 flex justify-between items-center transition-all">
            <div class="flex items-center gap-3">
                <span id="sync-spinner" class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
                <span id="sync-text" class="text-xs font-medium text-slate-200">Sincronizzazione in corso...</span>
            </div>
            <button onclick="document.getElementById('sync-banner').classList.add('hidden')" class="text-slate-400 hover:text-white text-xs">✕</button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-blue-50/50 border border-blue-100 p-5 rounded-2xl">
                <div class="text-[10px] font-black uppercase text-blue-500 tracking-wider">Totali</div>
                <div id="stat-total" class="text-3xl font-black text-blue-900 mt-1">0</div>
            </div>
            <div class="bg-red-50/50 border border-red-100 p-5 rounded-2xl">
                <div class="text-[10px] font-black uppercase text-red-500 tracking-wider">Scadute</div>
                <div id="stat-scadute" class="text-3xl font-black text-red-600 mt-1">0</div>
            </div>
            <div class="bg-amber-50/50 border border-amber-100 p-5 rounded-2xl">
                <div class="text-[10px] font-black uppercase text-amber-500 tracking-wider">In Scadenza (60 giorni)</div>
                <div id="stat-in-scadenza" class="text-3xl font-black text-amber-600 mt-1">0</div>
            </div>
            <div class="bg-emerald-50/50 border border-emerald-100 p-5 rounded-2xl">
                <div class="text-[10px] font-black uppercase text-emerald-500 tracking-wider">Regolari</div>
                <div id="stat-regolari" class="text-3xl font-black text-emerald-600 mt-1">0</div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 bg-slate-50/50 border-b border-slate-200 flex items-center justify-between gap-4">
                <div class="relative flex-1 max-w-sm">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="search" oninput="renderTable()" placeholder="Cerca pratica, comune o condominio..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-slate-400 uppercase text-[10px] font-black tracking-wider border-b border-slate-100">
                        <tr>
                            <th class="p-4">PI</th>
                            <th class="p-4">Scadenza</th>
                            <th class="p-4">Condominio / Ditta</th>
                            <th class="p-4">Comune</th>
                            <th class="p-4">Indirizzo</th>
                            <th class="p-4 text-right">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100 text-xs text-slate-700">
                        <!-- Righe generate dinamicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-pratica" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden border border-slate-100">
            <div class="p-6 bg-blue-600 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">Nuova Pratica Antincendio</h3>
                <button onclick="document.getElementById('modal-pratica').classList.add('hidden')" class="text-white/80 hover:text-white">✕</button>
            </div>
            <form id="form-pratica" onsubmit="addPratica(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Condominio / Ditta *</label>
                    <input type="text" id="input-condominio" required placeholder="Es. COMUNE DI VADO LIGURE" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Codice PI</label>
                        <input type="text" id="input-pi" placeholder="Es. #15324" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Scadenza *</label>
                        <input type="date" id="input-scadenza" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Comune</label>
                        <input type="text" id="input-comune" placeholder="Es. VADO LIGURE" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Indirizzo</label>
                        <input type="text" id="input-indirizzo" placeholder="Es. VIA XX SETTEMBRE" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="document.getElementById('modal-pratica').classList.add('hidden')" class="flex-1 py-3 text-xs font-bold text-slate-400 hover:text-slate-600">Annulla</button>
                    <button type="submit" class="flex-1 py-3 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-md shadow-blue-200 hover:bg-blue-700">Salva e Sincronizza</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // URL WEBHOOK DI GOOGLE APPS SCRIPT
        const GOOGLE_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbx0qVo__TYsbjqX_rrtxEAAxWqWhaEhrQ53xdou5dX_AjE89aBFiPZDGkiFkcM02eW0/exec";

        // Inizializzazione dati da LocalStorage o dati predefiniti
        let pratiche = JSON.parse(localStorage.getItem('prince_pratiche')) || [
            { id: 1, piCode: "#0", scadenza: "2000-12-30", condominio: "COMUNE DI VADO LIGURE – BIBLIOTECA", comune: "VADO", indirizzo: "XXXX" },
            { id: 2, piCode: "#13889", scadenza: "2000-12-30", condominio: "CARROZZERIA A10 PIETRA LIGURE", comune: "GIUSTENICE", indirizzo: "REG. CANUN" },
            { id: 3, piCode: "#250", scadenza: "2013-02-23", condominio: "COMUNE DI VADO LIGURE – SCUOLE PETERLIN", comune: "VADO", indirizzo: "VIA XXV APRILE 6" },
            { id: 4, piCode: "#15324", scadenza: "2018-01-10", condominio: "CONDOMINIO BORGO ANTICO", comune: "BOISSANO", indirizzo: "VIA TRICOLORE D'ITALIA 11" }
        ];

        function saveData() {
            localStorage.setItem('prince_pratiche', JSON.stringify(pratiche));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const search = document.getElementById('search').value.toLowerCase();
            tbody.innerHTML = '';

            let total = 0, scadute = 0, inScadenza = 0, regolari = 0;
            const today = new Date();
            today.setHours(0,0,0,0);

            pratiche.forEach(item => {
                if (search && !item.condominio.toLowerCase().includes(search) && !item.comune.toLowerCase().includes(search) && !item.piCode.toLowerCase().includes(search)) {
                    return;
                }

                total++;
                const expDate = new Date(item.scadenza);
                expDate.setHours(0,0,0,0);

                const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                let badgeClass = "bg-emerald-100 text-emerald-700";

                if (diffDays < 0) {
                    scadute++;
                    badgeClass = "bg-red-100 text-red-700 font-bold";
                } else if (diffDays <= 60) {
                    inScadenza++;
                    badgeClass = "bg-amber-100 text-amber-700 font-bold";
                } else {
                    regolari++;
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors border-b border-slate-100";
                tr.innerHTML = `
                    <td class="p-4 font-mono text-slate-500 font-semibold">${item.piCode || '-'}</td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 rounded-full text-[11px] ${badgeClass}">
                            ${expDate.toLocaleDateString('it-IT')}
                        </span>
                    </td>
                    <td class="p-4 font-bold text-slate-800">${item.condominio}</td>
                    <td class="p-4 text-slate-500">${item.comune || '-'}</td>
                    <td class="p-4 text-slate-400">${item.indirizzo || '-'}</td>
                    <td class="p-4 text-right">
                        <button onclick="deletePratica(${item.id})" class="text-slate-300 hover:text-red-500 transition-colors p-1">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-scadute').textContent = scadute;
            document.getElementById('stat-in-scadenza').textContent = inScadenza;
            document.getElementById('stat-regolari').textContent = regolari;
        }

        async function syncToGoogleSheets() {
            const banner = document.getElementById('sync-banner');
            const syncText = document.getElementById('sync-text');
            const syncSpinner = document.getElementById('sync-spinner');

            banner.classList.remove('hidden');
            syncSpinner.className = "w-3 h-3 rounded-full bg-blue-500 animate-pulse";
            syncText.textContent = "Invio dei dati a Google Sheets in corso...";

            try {
                await fetch(GOOGLE_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pratiche)
                });

                syncSpinner.className = "w-3 h-3 rounded-full bg-emerald-500";
                syncText.textContent = "✨ Sincronizzazione completata su Google Sheets (Sheet 1)!";
                setTimeout(() => banner.classList.add('hidden'), 4000);
            } catch (err) {
                syncSpinner.className = "w-3 h-3 rounded-full bg-red-500";
                syncText.textContent = "Errore durante l'invio dati a Google Sheets.";
            }
        }

        function addPratica(e) {
            e.preventDefault();
            const newPratica = {
                id: Date.now(),
                condominio: document.getElementById('input-condominio').value,
                piCode: document.getElementById('input-pi').value,
                scadenza: document.getElementById('input-scadenza').value,
                comune: document.getElementById('input-comune').value,
                indirizzo: document.getElementById('input-indirizzo').value
            };

            pratiche.unshift(newPratica);
            saveData();
            document.getElementById('form-pratica').reset();
            document.getElementById('modal-pratica').classList.add('hidden');
            
            // Sincronizza automaticamente dopo ogni aggiunta
            syncToGoogleSheets();
        }

        function deletePratica(id) {
            if (confirm("Vuoi eliminare questa pratica?")) {
                pratiche = pratiche.filter(p => p.id !== id);
                saveData();
                syncToGoogleSheets();
            }
        }

        function exportExcel() {
            let csvContent = "data:text/csv;charset=utf-8,PI,Scadenza,Condominio,Comune,Indirizzo\n";
            pratiche.forEach(p => {
                csvContent += `"${p.piCode}","${p.scadenza}","${p.condominio}","${p.comune}","${p.indirizzo}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "scadenziario_prince.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Caricamento iniziale
        renderTable();
    </script>
</body>
</html>
